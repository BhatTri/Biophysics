    <script>
    (function () {
        const D = window.SiteData;
        const grid = document.getElementById("gallery-image");
        const filters = document.getElementById("gal-filters");
        const countEl = document.getElementById("gal-count");
        let lightbox = null;

        /* Accept "photo.jpg", "./images/gallery/photo.jpg", "images/gallery/photo.jpg" or a full https:// link. */
        function photoPath(url) {
            url = url.trim().replace(/^\.\//, "");
            if (/^https?:\/\//i.test(url)) return url;
            if (!/^images\//i.test(url)) url = "images/gallery/" + url;
            return encodeURI(url);
        }

        function refreshLightbox() {
            if (lightbox) lightbox.destroy();
            lightbox = GLightbox({ selector: ".g-item:not(.hidden)", touchNavigation: true, loop: true, descPosition: "bottom" });
        }

        function updateCount() {
            const shown = grid.querySelectorAll(".g-item:not(.hidden)").length;
            countEl.textContent = shown + (shown === 1 ? " photo" : " photos");
        }

        D.load("./data/gallery.xml").then(function (xml) {
            const items = Array.prototype.filter.call(xml.querySelectorAll("image"), function (el) {
                return D.text(el, "url");
            }).map(function (el) {
                return {
                    src: photoPath(D.text(el, "url")),
                    caption: D.text(el, "caption"),
                    cat: D.text(el, "category"),
                    featured: D.flag(el, "featured")
                };
            });

            grid.innerHTML = items.map(function (it) {
                return '<a class="g-item' + (it.featured ? " big" : "") + (it.caption ? " has-cap" : "") + '" href="' + D.esc(it.src) + '"' +
                       ' data-gallery="lab" data-cat="' + D.esc(it.cat) + '"' +
                       (it.caption ? ' data-description="' + D.esc(it.caption) + '"' : "") + ">" +
                       '<img loading="lazy" src="' + D.esc(it.src) + '" alt="' + D.esc(it.caption || "Lab photo") + '">' +
                       (it.cat ? '<span class="g-tag">' + D.esc(it.cat) + "</span>" : "") +
                       (it.caption ? '<span class="g-cap">' + D.esc(it.caption) + "</span>" : "") +
                       "</a>";
            }).join("");

            /* Tile shape follows the photo: wide photos span 2 columns, tall ones 2 rows. */
            grid.querySelectorAll(".g-item img").forEach(function (img) {
                function shape() {
                    const tile = img.closest(".g-item");
                    if (tile.classList.contains("big") || !img.naturalWidth) return;
                    const r = img.naturalWidth / img.naturalHeight;
                    if (r > 1.45) tile.classList.add("wide");
                    else if (r < 0.8) tile.classList.add("tall");
                }
                if (img.complete) shape(); else img.addEventListener("load", shape);
                img.addEventListener("error", function () { img.closest(".g-item").remove(); updateCount(); refreshLightbox(); });
            });

            /* Category filter buttons (only for categories that are used) */
            const cats = [];
            items.forEach(function (it) { if (it.cat && cats.indexOf(it.cat) === -1) cats.push(it.cat); });
            cats.forEach(function (c) {
                const b = document.createElement("button");
                b.dataset.cat = c;
                b.textContent = c;
                filters.appendChild(b);
            });
            if (!cats.length) filters.style.display = "none";

            filters.addEventListener("click", function (e) {
                const btn = e.target.closest("button");
                if (!btn) return;
                filters.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
                grid.querySelectorAll(".g-item").forEach(function (a) {
                    a.classList.toggle("hidden", btn.dataset.cat !== "all" && a.dataset.cat !== btn.dataset.cat);
                });
                updateCount();
                refreshLightbox();
            });

            updateCount();
            refreshLightbox();
        }).catch(function (err) {
            D.showError(grid, err);
        });
    })();
    </script>
