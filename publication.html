    <!-- Template Main JS File -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/site-data.js"></script>
    <script>
    (function () {
        const D = window.SiteData;
        const container = document.getElementById("publications-container");
        const countEl = document.getElementById("pub-count");
        const searchEl = document.getElementById("pub-search");
        const chips = document.querySelectorAll(".pub-chip");
        const PI = "Tripta Bhatia";
        let pubs = [];
        let activeType = "all";

        /* Work out the kind of entry. An explicit <type> wins; otherwise guess from the journal text. */
        function kindOf(p) {
            const t = p.type.toLowerCase();
            if (t === "journal" || t === "preprint" || t === "thesis") return t;
            if (/thesis/i.test(p.journal)) return "thesis";
            if (/arxiv|biorxiv|medrxiv|chemrxiv|preprint/i.test(p.journal + " " + p.note)) return "preprint";
            return "journal";
        }

        function card(p, num) {
            const authors = D.esc(p.authors).split(PI).join("<strong>" + PI + "</strong>");
            const tag = p.kind === "preprint" ? '<span class="pub-tag preprint">Preprint</span>'
                      : p.kind === "thesis" ? '<span class="pub-tag thesis">Thesis</span>' : "";
            const title = p.link
                ? '<a href="' + D.esc(p.link) + '" target="_blank" rel="noopener">' + D.esc(p.name) + "</a>"
                : D.esc(p.name);
            const links = [];
            if (p.link) links.push('<a class="pub-link" href="' + D.esc(p.link) + '" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> ' + (p.kind === "preprint" ? "Read preprint" : "Article") + "</a>");
            if (p.arvixShow && p.arvixLink && p.arvixLink !== p.link) links.push('<a class="pub-link" href="' + D.esc(p.arvixLink) + '" target="_blank" rel="noopener"><i class="bi bi-file-earmark-text"></i> ' + D.esc(p.arvix || "Preprint") + "</a>");
            if (p.specialLink) links.push('<a class="pub-link" href="' + D.esc(p.specialLink) + '"' + (/^https?:/i.test(p.specialLink) ? ' target="_blank" rel="noopener"' : "") + '>' +
                (/softwares\.html/i.test(p.specialLink) ? '<i class="bi bi-code-slash"></i> Software' : '<i class="bi bi-star"></i> More') + "</a>");

            return '<article class="pub-card is-' + p.kind + (p.isNew ? " is-new" : "") + '">' +
                '<div class="pub-num">' + num + "</div>" +
                '<div class="pub-body">' +
                    '<h3 class="pub-title">' + title + "</h3>" +
                    (p.authors ? '<div class="pub-authors">' + authors + "</div>" : "") +
                    '<div class="pub-meta">' +
                        (p.isNew ? '<span class="pub-tag new">New</span>' : "") + tag +
                        (p.journal ? '<span class="pub-venue">' + D.esc(p.journal) + "</span>" : "") +
                        (p.note ? '<span class="pub-note">' + D.esc(p.note) + "</span>" : "") +
                    "</div>" +
                    (links.length ? '<div class="pub-links">' + links.join("") + "</div>" : "") +
                    (p.special ? '<div class="pub-special">' + p.special + "</div>" : "") +
                "</div>" +
                (p.image ? '<div class="pub-thumb"><a href="' + D.esc(p.link || "#") + '" target="_blank" rel="noopener"><img loading="lazy" src="./images/publications/' + D.esc(p.image) + '" alt=""></a></div>' : "") +
            "</article>";
        }

        function render() {
            const q = searchEl.value.trim().toLowerCase();
            const shown = pubs.filter(function (p) {
                if (activeType !== "all" && p.kind !== activeType) return false;
                return !q || p.haystack.indexOf(q) !== -1;
            });
            countEl.textContent = shown.length === pubs.length
                ? pubs.length + " publications"
                : "Showing " + shown.length + " of " + pubs.length;
            if (!shown.length) {
                container.innerHTML = '<p class="pub-empty">No publications match your search.</p>';
                return;
            }
            let out = "", lastYear = null, n = shown.length;
            shown.forEach(function (p) {
                if (p.year !== lastYear) {
                    out += '<h2 class="pub-year">' + D.esc(p.year || "Other") + "</h2>";
                    lastYear = p.year;
                }
                out += card(p, n--);
            });
            container.innerHTML = out;
        }

        D.load("./data/publications.xml").then(function (xml) {
            pubs = Array.prototype.map.call(xml.querySelectorAll("pub"), function (el) {
                const p = {
                    name: D.text(el, "name"),
                    year: D.text(el, "year"),
                    link: D.text(el, "link"),
                    journal: D.text(el, "journal"),
                    authors: D.text(el, "authors"),
                    note: D.text(el, "note"),
                    image: D.text(el, "image"),
                    type: D.text(el, "type"),
                    arvix: D.text(el, "arvix"),
                    arvixLink: D.text(el, "arvix_link"),
                    arvixShow: D.flag(el, "arvix_display"),
                    special: D.html(el, "special_notes"),
                    specialLink: D.text(el, "special_notes_link"),
                    isNew: D.flag(el, "highlight")
                };
                p.kind = kindOf(p);
                p.haystack = [p.name, p.authors, p.journal, p.year, p.note].join(" ").toLowerCase();
                return p;
            }).filter(function (p) { return p.name; });
            render();
        }).catch(function (err) {
            D.showError(container, err);
        });

        searchEl.addEventListener("input", render);
        chips.forEach(function (chip) {
            chip.addEventListener("click", function () {
                chips.forEach(function (c) { c.classList.remove("active"); });
                chip.classList.add("active");
                activeType = chip.dataset.type;
                render();
            });
        });
    })();
    </script>
